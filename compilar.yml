name: Compilar Inventario Filamentos

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias y PyInstaller
        run: |
          pip install pyinstaller pillow
          pyinstaller --onefile --noconsole --name "InventarioFilamentos" app.py

      - name: Subir Ejecutable Listo
        uses: actions/upload-artifact@v4
        with:
          name: InventarioFilamentos-Windows
          path: dist/InventarioFilamentos.exe
